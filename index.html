      function drawSunIcon(x, y, r) {
        ctx.save();
        ctx.translate(x, y);

        // 光晕
        const glow = ctx.createRadialGradient(0, 0, r * .3, 0, 0, r * 1.7);
        glow.addColorStop(0, "rgba(255, 232, 125, .38)");
        glow.addColorStop(1, "rgba(255, 232, 125, 0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, r * 1.7, 0, Math.PI * 2);
        ctx.fill();

        // 光芒
        ctx.beginPath();
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2;
          const ax = Math.cos(a) * r * .88;
          const ay = Math.sin(a) * r * .88;
          const bx = Math.cos(a + .24) * r * 1.42;
          const by = Math.sin(a + .24) * r * 1.42;
          const cx = Math.cos(a - .24) * r * 1.42;
          const cy = Math.sin(a - .24) * r * 1.42;
          if (i === 0) ctx.moveTo(ax, ay);
          ctx.lineTo(bx, by);
          ctx.lineTo(cx, cy);
          ctx.closePath();
        }
        ctx.fillStyle = "#f6c23b";
        ctx.fill();

        // 中心
        const sunGrad = ctx.createRadialGradient(-r * .25, -r * .3, r * .1, 0, 0, r);
        sunGrad.addColorStop(0, "#fff6c8");
        sunGrad.addColorStop(.45, "#ffd34e");
        sunGrad.addColorStop(1, "#e6a41e");
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = sunGrad;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(-r * .25, -r * .3, r * .5, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,.55)";
        ctx.fill();
        ctx.strokeStyle = "rgba(190, 118, 20, .35)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      function drawPlantLegacy(p) {
        ctx.save();
        ctx.translate(p.x, p.y);
        if (p.boostVisual > 0) {
          ctx.globalAlpha = .5 + Math.sin(elapsed * 18) * .2;
          ctx.strokeStyle = "#8be6ff";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(0, 0, 36 + p.boostVisual * 8, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }

        if (p.type === "sunflower") {
          ctx.fillStyle = "#3d8a2d";
          ctx.fillRect(-4, 4, 8, 33);
          ctx.save();
          ctx.translate(0, -6 + Math.sin(elapsed * 2 + p.bob) * 1.4);
          for (let i = 0; i < 12; i++) {
            const a = (i / 12) * Math.PI * 2;
            ctx.save();
            ctx.translate(Math.cos(a) * 18, Math.sin(a) * 18);
            ctx.rotate(a);
            ctx.fillStyle = "#f7c948";
            ctx.beginPath();
            ctx.ellipse(0, 0, 12, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#d99b1e";
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.restore();
          }
          ctx.beginPath();
          ctx.arc(0, 0, 15, 0, Math.PI * 2);
          ctx.fillStyle = "#f3b13d";
          ctx.fill();
          ctx.fillStyle = "#3c2716";
          ctx.beginPath();
          ctx.arc(-4, -3, 2, 0, Math.PI * 2);
          ctx.arc(4, -3, 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#3c2716";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 5, 6, .15, Math.PI - .15);
          ctx.stroke();
          ctx.restore();
        } else if (p.type === "peashooter" || p.type === "snowpea") {
          const green = p.type === "snowpea" ? "#4ba7c7" : "#3d8a2d";
          const head = p.type === "snowpea" ? "#7cc9f2" : "#65b945";
          const dark = p.type === "snowpea" ? "#2e7f77" : "#3d8a2d";
          const eye = p.type === "snowpea" ? "#0c3f55" : "#183c17";
          ctx.strokeStyle = green;
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.moveTo(0, 5);
          ctx.lineTo(0, 28);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, 0, 20, 0, Math.PI * 2);
          ctx.fillStyle = head;
          ctx.fill();
          ctx.strokeStyle = dark;
          ctx.lineWidth = 2.5;
          ctx.stroke();
          ctx.fillStyle = head;
          ctx.beginPath();
          ctx.moveTo(18, -3);
          ctx.lineTo(47, -9);
          ctx.lineTo(18, 10);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = eye;
          ctx.beginPath();
          ctx.arc(-7, -4, 2.7, 0, Math.PI * 2);
          ctx.arc(5, -4, 2.7, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = eye;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(-1, 6, 5, .2, Math.PI - .2);
          ctx.stroke();
          if (p.type === "snowpea") {
            ctx.fillStyle = "#e6f8ff";
            ctx.beginPath();
            ctx.arc(-15, -12, 2, 0, Math.PI * 2);
            ctx.arc(12, -14, 2, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (p.type === "wallnut") {
          ctx.fillStyle = "#b57a3c";
          ctx.strokeStyle = "#71481f";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.ellipse(0, 0, 25, 33, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "#c98d4b";
          ctx.beginPath();
          ctx.ellipse(-2, -4, 18, 25, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#2b2014";
          ctx.beginPath();
          ctx.ellipse(-7, -10, 4, 7, 0, 0, Math.PI * 2);
          ctx.ellipse(7, -10, 4, 7, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#3c2b1a";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 7, 9, .2, Math.PI - .2);
          ctx.stroke();
          if (p.hp < p.maxHp * .55) {
            ctx.strokeStyle = "#5a341c";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-14, -18);
            ctx.lineTo(-3, -10);
            ctx.moveTo(8, -16);
            ctx.lineTo(15, -5);
            ctx.stroke();
          }
          if (p.hp < p.maxHp * .25) {
            ctx.strokeStyle = "#5a341c";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-9, 3);
            ctx.lineTo(5, 7);
            ctx.moveTo(3, 16);
            ctx.lineTo(12, 13);
            ctx.stroke();
          }
          if (p.hp > 4000) {
            ctx.strokeStyle = "#8be6ff";
            ctx.lineWidth = 5;
            ctx.globalAlpha = .7;
            ctx.beginPath();
            ctx.arc(0, 0, 31, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
        } else if (p.type === "cherrybomb") {
          const fuse = Math.max(0, p.fuseTimer / PLANT_DEFS.cherrybomb.fuse);
          const shake = fuse < .35 ? (Math.random() - .5) * 3 : 0;
          ctx.translate(shake, shake);
          ctx.strokeStyle = "#3d8a2d";
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(4, 0);
          ctx.lineTo(-9, -20);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(-17, -15, 17, 0, Math.PI * 2);
          ctx.fillStyle = "#e84b3e";
          ctx.fill();
          ctx.strokeStyle = "#a4241c";
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(17, -14, 17, 0, Math.PI * 2);
          ctx.fillStyle = "#f15d4f";
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "#fff0d0";
          ctx.beginPath();
          ctx.arc(-12, -20, 2.5, 0, Math.PI * 2);
          ctx.arc(20, -19, 2.5, 0, Math.PI * 2);
          ctx.fill();
          if (fuse < .55) {
            ctx.fillStyle = "#ffb14a";
            ctx.beginPath();
            ctx.arc(0, -27, 3 + Math.random() * 3, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // 血量条（受损时）
        if (p.hp < p.maxHp && p.type !== "cherrybomb") {
          const w = 46;
          const pct = Math.max(0, p.hp / p.maxHp);
          ctx.fillStyle = "rgba(0,0,0,.35)";
          ctx.fillRect(-w / 2, -48, w, 5);
          ctx.fillStyle = pct > .5 ? "#7ed957" : pct > .25 ? "#f6c945" : "#e74c3c";
          ctx.fillRect(-w / 2 + 1, -47, (w - 2) * pct, 3);
        }
        ctx.restore();
      }

      // ===== 美术助手：立体球体 / 渐变椭圆 / 叶子 / 表情 =====
      function darken(hex, f) {
        const n = parseInt(hex.slice(1), 16);
        const r = Math.max(0, Math.round(((n >> 16) & 255) * (1 - f)));
        const g = Math.max(0, Math.round(((n >> 8) & 255) * (1 - f)));
        const b = Math.max(0, Math.round((n & 255) * (1 - f)));
        return `rgb(${r},${g},${b})`;
      }

      function ball(x, y, r, c1, c2, c3, stroke, sw) {
        ctx.save();
        ctx.translate(x, y);
        const g = ctx.createRadialGradient(-r * .35, -r * .42, r * .08, 0, 0, r * 1.02);
        g.addColorStop(0, c1);
        g.addColorStop(.52, c2);
        g.addColorStop(1, c3);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = sw || 2;
          ctx.stroke();
        }
        // 底部环境光遮蔽
        ctx.fillStyle = "rgba(0,0,0,.16)";
        ctx.beginPath();
        ctx.arc(0, r * .32, r * .98, 0, Math.PI * 2);
        ctx.fill();
        // 高光
        ctx.fillStyle = "rgba(255,255,255,.32)";
        ctx.beginPath();
        ctx.ellipse(-r * .38, -r * .48, r * .26, r * .17, -.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function shadedEllipse(x, y, rx, ry, rot, c1, c2, c3, stroke, sw) {
        ctx.save();
        ctx.translate(x, y);
        if (rot) ctx.rotate(rot);
        const g = ctx.createLinearGradient(-rx * .7, -ry * .7, rx * .7, ry * .7);
        g.addColorStop(0, c1);
        g.addColorStop(.5, c2);
        g.addColorStop(1, c3);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = sw || 2;
          ctx.stroke();
        }
        ctx.restore();
      }

      function plantLeaf(x, y, rot, size, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        const g = ctx.createLinearGradient(-size, 0, size, 0);
        g.addColorStop(0, color);
        g.addColorStop(1, darken(color, .28));
        ctx.fillStyle = g;
        ctx.strokeStyle = "rgba(20,60,20,.55)";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.ellipse(0, 0, size, size * .42, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // 主叶脉
        ctx.strokeStyle = "rgba(255,255,255,.24)";
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(-size * .6, 0);
        ctx.quadraticCurveTo(0, 0, size * .7, 0);
        ctx.stroke();
        ctx.restore();
      }

      // 表情：style "white"（白眼白+瞳孔）或 "black"（黑豆眼+高光）；mood happy/grin/angry/sad
      function plantFace(ex1, ey1, ex2, ey2, eyeR, mouthY, mouthR, mood, style) {
        if (style === "white") {
          ctx.fillStyle = "#fffdf2";
          ctx.strokeStyle = "rgba(30,20,10,.8)";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(ex1, ey1, eyeR, 0, Math.PI * 2);
          ctx.arc(ex2, ey2, eyeR, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "#241a10";
          ctx.beginPath();
          ctx.arc(ex1 - eyeR * .12, ey1 + eyeR * .12, eyeR * .5, 0, Math.PI * 2);
          ctx.arc(ex2 - eyeR * .12, ey2 + eyeR * .12, eyeR * .5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,.9)";
          ctx.beginPath();
          ctx.arc(ex1 - eyeR * .3, ey1 - eyeR * .32, eyeR * .24, 0, Math.PI * 2);
          ctx.arc(ex2 - eyeR * .3, ey2 - eyeR * .32, eyeR * .24, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = "#241a10";
          ctx.beginPath();
          ctx.ellipse(ex1, ey1, eyeR, eyeR * 1.15, 0, 0, Math.PI * 2);
          ctx.ellipse(ex2, ey2, eyeR, eyeR * 1.15, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,.85)";
          ctx.beginPath();
          ctx.arc(ex1 - eyeR * .32, ey1 - eyeR * .32, eyeR * .3, 0, Math.PI * 2);
          ctx.arc(ex2 - eyeR * .32, ey2 - eyeR * .32, eyeR * .3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.strokeStyle = "#241a10";
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.beginPath();
        if (mood === "grin") {
          ctx.arc(0, mouthY, mouthR, .15, Math.PI - .15);
        } else if (mood === "angry") {
          ctx.moveTo(-mouthR, mouthY - 2);
          ctx.quadraticCurveTo(0, mouthY + 4, mouthR, mouthY - 2);
        } else if (mood === "sad") {
          ctx.arc(0, mouthY + mouthR * .6, mouthR, Math.PI * 1.15, Math.PI * 1.85);
        } else {
          ctx.arc(0, mouthY, mouthR, .25, Math.PI - .25);
        }
        ctx.stroke();
      }

      function drawPlant(p) {
        const now = elapsed * 1000;
        const depth = depthScale(p.row);
        ctx.save();

        // 影子（贴合地面，随深度变化）
        ctx.save();
        ctx.translate(p.x, p.y + 34);
        ctx.scale(depth, depth);
        ctx.fillStyle = `rgba(16, 34, 12, ${.16 + depth * .08})`;
        ctx.beginPath();
        ctx.ellipse(0, 0, 26, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 实体变换：以脚底为锚点缩放（深度 + 生长动画）
        ctx.translate(p.x, p.y + 34);
        ctx.scale(depth, depth);
        const gs = p.grow < 1 ? easeOutBack(p.grow) : 1;
        ctx.scale(gs, gs);
        ctx.translate(0, -34);

        // 能量豆光环
        if (p.boostVisual > 0) {
          ctx.globalAlpha = .38 + Math.sin(now * .018) * .22;
          ctx.strokeStyle = "#8be6ff";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(0, -4, 38 + p.boostVisual * 9, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }

        if (p.type === "sunflower") {
          // 茎（S 形渐变）
          const stemG = ctx.createLinearGradient(-4, 0, 4, 0);
          stemG.addColorStop(0, "#2e7d2b");
          stemG.addColorStop(.5, "#55a83f");
          stemG.addColorStop(1, "#3a8a2c");
          ctx.strokeStyle = stemG;
          ctx.lineWidth = 9;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(0, 8);
          ctx.quadraticCurveTo(-2, 20, 1, 34);
          ctx.stroke();
          plantLeaf(-10, 23, -.9, 13, "#5cb545");
          plantLeaf(11, 18, .9, 13, "#5cb545");

          const bobY = -8 + Math.sin(now * .0021 + p.bob) * 2.2;
          ctx.save();
          ctx.translate(0, bobY);

          // 花瓣：双层，每片渐变 + 描边 + 高光
          for (let layer = 0; layer < 2; layer++) {
            const count = layer === 0 ? 14 : 10;
            const radius = layer === 0 ? 19 : 16;
            const petalLen = layer === 0 ? 15 : 12;
            for (let i = 0; i < count; i++) {
              const a = (i / count) * Math.PI * 2 + (layer === 0 ? Math.PI / count : 0);
              ctx.save();
              ctx.translate(Math.cos(a) * radius, Math.sin(a) * radius);
              ctx.rotate(a + Math.PI / 2);
              const pg = ctx.createLinearGradient(0, -petalLen, 0, petalLen);
              pg.addColorStop(0, "#fff3ae");
              pg.addColorStop(.45, "#ffd34e");
              pg.addColorStop(1, "#dd9d20");
              ctx.fillStyle = pg;
              ctx.strokeStyle = "#b97d15";
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.ellipse(0, 0, 6.5, petalLen, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
              ctx.fillStyle = "rgba(255,255,255,.35)";
              ctx.beginPath();
              ctx.ellipse(1, -petalLen * .35, 2.2, petalLen * .3, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
          }

          // 花盘：放射渐变 + 种子纹理 + 高光
          const discG = ctx.createRadialGradient(-4, -5, 3, 0, 0, 18);
          discG.addColorStop(0, "#e2a53c");
          discG.addColorStop(.55, "#a9641f");
          discG.addColorStop(1, "#5e3212");
          ctx.fillStyle = discG;
          ctx.strokeStyle = "#4a2610";
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.arc(0, 0, 17, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "rgba(70,38,10,.5)";
          for (let i = 0; i < 14; i++) {
            const a = (i / 14) * Math.PI * 2;
            ctx.beginPath();
            ctx.arc(Math.cos(a) * 12.5, Math.sin(a) * 12.5, 1.1, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = "rgba(255,255,255,.22)";
          ctx.beginPath();
          ctx.ellipse(-5, -6, 6, 4, -.5, 0, Math.PI * 2);
          ctx.fill();

          // 表情
          plantFace(-6, -3, 5, -3, 3.4, 7, 6.5, "happy", "black");
          ctx.restore();
        } else if (p.type === "peashooter" || p.type === "snowpea" || p.type === "repeater") {
          const ice = p.type === "snowpea";
          const rep = p.type === "repeater";
          const C = {
            head: rep ? "#7ac74f" : ice ? "#7cc9f2" : "#65b945",
            headL: rep ? "#d9f7ae" : ice ? "#e6f9ff" : "#b8e97c",
            headD: rep ? "#3f8f32" : ice ? "#2e7f77" : "#2e6f26",
            stem: rep ? "#5fb03f" : ice ? "#4aa4b9" : "#4f9b3a",
            stemD: rep ? "#3f8a2e" : ice ? "#2f7e77" : "#2f7d2c",
            barrel: rep ? "#67b043" : ice ? "#5bc5e2" : "#55a83f",
            barrelD: rep ? "#4b9637" : ice ? "#2f8ea8" : "#2f7830",
            eye: ice ? "#0c3f55" : "#173c17"
          };
          // 茎（圆柱渐变）
          const stemG2 = ctx.createLinearGradient(-4, 0, 4, 0);
          stemG2.addColorStop(0, C.stemD);
          stemG2.addColorStop(.5, C.stem);
          stemG2.addColorStop(1, C.stemD);
          ctx.strokeStyle = stemG2;
          ctx.lineWidth = 9;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(0, 6);
          ctx.quadraticCurveTo(1, 20, 0, 34);
          ctx.stroke();
          plantLeaf(-10, 22, -.85, 13, C.stem);
          plantLeaf(11, 17, .85, 13, C.stem);

          // 头部（带射击后坐）
          ctx.save();
          ctx.translate(-(p.recoil || 0) * 3, 0);
          ball(0, 0, 21, C.headL, C.head, C.headD, C.headD, 2.4);

          // 头顶小芽
          ctx.strokeStyle = C.stem;
          ctx.lineWidth = 3;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(0, -19);
          ctx.quadraticCurveTo(3, -25, 0, -28);
          ctx.stroke();

          // 枪管（圆柱渐变；双发射手两根）
          const barrels = rep ? 2 : 1;
          for (let b = 0; b < barrels; b++) {
            const by = b === 0 ? 6 : -8;
            ctx.save();
            ctx.translate(16, by);
            const bg = ctx.createLinearGradient(0, -9, 0, 9);
            bg.addColorStop(0, C.barrelD);
            bg.addColorStop(.5, C.barrel);
            bg.addColorStop(1, C.barrelD);
            ctx.fillStyle = bg;
            ctx.strokeStyle = C.headD;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -9);
            ctx.quadraticCurveTo(22, -12, 34, -13);
            ctx.lineTo(34, 5);
            ctx.quadraticCurveTo(22, 4, 0, 8);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // 管口
            ctx.fillStyle = "rgba(25,40,20,.4)";
            ctx.beginPath();
            ctx.ellipse(33, -4, 3, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          // 眼睛 + 腮红
          plantFace(-7, -7, 6, -7, 4.2, 8, 6, "happy", "white");
          ctx.fillStyle = "rgba(255,120,90,.22)";
          ctx.beginPath();
          ctx.ellipse(-16, 0, 4, 2.6, 0, 0, Math.PI * 2);
          ctx.ellipse(15, 0, 4, 2.6, 0, 0, Math.PI * 2);
          ctx.fill();

          if (ice) {
            // 冰霜与冰晶
            ctx.fillStyle = "rgba(255,255,255,.85)";
            ctx.beginPath();
            ctx.arc(-18, -16, 2.2, 0, Math.PI * 2);
            ctx.arc(13, -19, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,.8)";
            ctx.lineWidth = 1.2;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(-18, -21); ctx.lineTo(-18, -27);
            ctx.moveTo(13, -24); ctx.lineTo(13, -31);
            ctx.moveTo(-22, -24); ctx.lineTo(-14, -24);
            ctx.moveTo(9, -27); ctx.lineTo(17, -27);
            ctx.stroke();
          }
          ctx.restore();
        } else if (p.type === "wallnut") {
          ctx.save();
          // 本体（双层椭圆 + 轮廓光）
          const bodyG2 = ctx.createRadialGradient(-9, -13, 4, 0, 0, 38);
          bodyG2.addColorStop(0, "#ecd08f");
          bodyG2.addColorStop(.45, "#c98d4b");
          bodyG2.addColorStop(1, "#7c4e20");
          ctx.fillStyle = bodyG2;
          ctx.strokeStyle = "#573616";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.ellipse(0, 0, 26, 34, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          // 高光（左上）
          ctx.fillStyle = "rgba(255,244,208,.4)";
          ctx.beginPath();
          ctx.ellipse(-9, -14, 11, 18, -.2, 0, Math.PI * 2);
          ctx.fill();
          // 底部反光
          ctx.fillStyle = "rgba(255,240,200,.18)";
          ctx.beginPath();
          ctx.ellipse(6, 18, 10, 6, .3, 0, Math.PI * 2);
          ctx.fill();
          // 核桃沟槽纹理
          ctx.strokeStyle = "rgba(90,55,25,.45)";
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.ellipse(0, 2, 20, 27, .12, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.ellipse(-3, 4, 16, 22, -.1, 0, Math.PI * 2);
          ctx.stroke();

          // 表情：忧愁大眼 + 委屈眉
          plantFace(-8, -9, 8, -9, 4.4, 9, 8.5, "sad", "white");
          ctx.strokeStyle = "#4a2d12";
          ctx.lineWidth = 2.4;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(-13, -15);
          ctx.quadraticCurveTo(-8, -18, -4, -16);
          ctx.moveTo(13, -15);
          ctx.quadraticCurveTo(8, -18, 4, -16);
          ctx.stroke();

          // 损伤裂纹（随血量加深）
          const crackCol = "#4f2d16";
          ctx.strokeStyle = crackCol;
          ctx.lineWidth = 2;
          if (p.hp < p.maxHp * .6) {
            ctx.beginPath();
            ctx.moveTo(-18, -23); ctx.lineTo(-10, -14); ctx.lineTo(-16, -6);
            ctx.moveTo(12, -26); ctx.lineTo(18, -18); ctx.lineTo(12, -12);
            ctx.stroke();
          }
          if (p.hp < p.maxHp * .28) {
            ctx.beginPath();
            ctx.moveTo(8, 2); ctx.lineTo(17, 8); ctx.lineTo(10, 18);
            ctx.moveTo(-14, 12); ctx.lineTo(-6, 18); ctx.lineTo(-12, 26);
            ctx.stroke();
          }

          // 能量豆附加装甲
          if (p.maxHp > PLANT_DEFS.wallnut.hp) {
            ctx.strokeStyle = "#8be6ff";
            ctx.lineWidth = 5;
            ctx.globalAlpha = .68 + Math.sin(now * .012) * .16;
            ctx.beginPath();
            ctx.arc(0, 0, 34, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
          ctx.restore();
        } else if (p.type === "cherrybomb") {
          const fuse = Math.max(0, p.fuseTimer / PLANT_DEFS.cherrybomb.fuse);
          const shake = fuse < .35 ? (Math.random() - .5) * 4 : 0;
          ctx.translate(shake, shake);

          // 引信火花光晕
          const fireGlow = ctx.createRadialGradient(0, -25, 2, 0, -25, 30);
          fireGlow.addColorStop(0, "rgba(255, 232, 120, .9)");
          fireGlow.addColorStop(.45, "rgba(255, 132, 57, .3)");
          fireGlow.addColorStop(1, "rgba(255, 50, 40, 0)");
          ctx.fillStyle = fireGlow;
          ctx.beginPath();
          ctx.arc(0, -25, 32, 0, Math.PI * 2);
          ctx.fill();

          // 茎与叶（带叶脉）
          ctx.strokeStyle = "#3f8e2e";
          ctx.lineWidth = 5;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(4, -2);
          ctx.quadraticCurveTo(3, -18, -8, -27);
          ctx.stroke();
          ctx.fillStyle = "#5bb13a";
          ctx.strokeStyle = "rgba(20,80,20,.5)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.ellipse(-13, -27, 11, 5.5, -.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(-18, -28);
          ctx.lineTo(-8, -25);
          ctx.stroke();

          // 两颗樱桃（立体球）
          ball(-17, -15, 18, "#ffb08f", "#e84b3e", "#8d1713", "#7c120e", 3);
          ball(17, -14, 18, "#ffb08f", "#f15d4f", "#941d15", "#7c120e", 3);

          // 愤怒表情：左樱桃
          ctx.strokeStyle = "#5e120c";
          ctx.lineWidth = 2.6;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(-26, -24);
          ctx.quadraticCurveTo(-20, -28, -15, -24);
          ctx.stroke();
          ctx.fillStyle = "#4a0e08";
          ctx.beginPath();
          ctx.arc(-21, -19, 2.6, 0, Math.PI * 2);
          ctx.arc(-12, -20, 2.6, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#5e120c";
          ctx.beginPath();
          ctx.moveTo(-21, -15);
          ctx.quadraticCurveTo(-16.5, -12, -12, -15);
          ctx.stroke();
          // 右樱桃
          ctx.beginPath();
          ctx.moveTo(9, -22);
          ctx.quadraticCurveTo(15, -27, 21, -22);
          ctx.stroke();
          ctx.fillStyle = "#4a0e08";
          ctx.beginPath();
          ctx.arc(13, -18, 2.6, 0, Math.PI * 2);
          ctx.arc(21, -19, 2.6, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#5e120c";
          ctx.beginPath();
          ctx.moveTo(13, -14);
          ctx.quadraticCurveTo(17, -11, 21, -14);
          ctx.stroke();

          // 引信 + 火花
          ctx.strokeStyle = "#6b3c2a";
          ctx.lineWidth = 2.2;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(0, -28);
          ctx.quadraticCurveTo(6, -34, 3, -39);
          ctx.stroke();
          if (fuse < .7) {
            ctx.fillStyle = "#ffd76a";
            ctx.beginPath();
            ctx.arc(3, -39, 3 + Math.random() * 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ff8c3a";
            ctx.beginPath();
            ctx.arc(3, -39, 2 + Math.random() * 2, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (p.type === "potatomine") {
          const bobY = Math.sin(now * .003 + p.bob) * 1.5;
          // 落地阴影
          ctx.fillStyle = "rgba(0,0,0,.18)";
          ctx.beginPath();
          ctx.ellipse(0, 30, 27, 6, 0, 0, Math.PI * 2);
          ctx.fill();
          // 土堆（双层立体 + 颗粒）
          shadedEllipse(0, 18, 21, 7, 0, "#9a743d", "#6d4c22", "#4a3014", "#3c2710", 2);

        // 上牙
        ctx.fillStyle = "#e8e0c0";
        ctx.beginPath();
        ctx.roundRect(-8, -22, 4.5, 4.5, 1);
        ctx.roundRect(4, -22, 4.5, 4.5, 1);
        ctx.fill();
        // 下牙（啃食时露出）
        if (jawOpen > 1) {
          ctx.fillStyle = "#e8e0c0";
          ctx.beginPath();
          ctx.roundRect(-5, -14, 3.5, 4, 1);
          ctx.roundRect(3, -14, 3.5, 4, 1);
          ctx.fill();
        }

        // 帽子
        if (z.hat === "cone") {
          // 交通锥：渐变 + 底圈 + 反光带
          const coneG2 = ctx.createLinearGradient(-18, -36, 12, -70);
          coneG2.addColorStop(0, "#ffc06b");
          coneG2.addColorStop(.5, "#e78a35");
          coneG2.addColorStop(1, "#a84c12");
          ctx.fillStyle = coneG2;
          ctx.strokeStyle = "#7a3a08";
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.moveTo(-18, -35);
          ctx.lineTo(0, -70);
          ctx.lineTo(18, -35);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          // 底座圈
          ctx.fillStyle = "#b96a1f";
          ctx.beginPath();
          ctx.roundRect(-22, -38, 44, 6, 3);
          ctx.fill();
          ctx.strokeStyle = "#7a3a08";
          ctx.lineWidth = 2;
          ctx.stroke();
          // 反光带
          ctx.strokeStyle = "rgba(255,255,255,.5)";
          ctx.lineWidth = 3.5;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(-12, -46);
          ctx.lineTo(-2, -62);
          ctx.moveTo(11, -47);
          ctx.lineTo(2, -59);
          ctx.stroke();
        } else if (z.hat === "bucket") {
          // 铁桶：金属渐变 + 桶沿 + 高光 + 锈迹
          const buckG2 = ctx.createLinearGradient(-20, -64, 20, -36);
          buckG2.addColorStop(0, "#c3ccd1");
          buckG2.addColorStop(.5, "#8a959b");
          buckG2.addColorStop(1, "#4a565c");
          ctx.fillStyle = buckG2;
          ctx.strokeStyle = "#283239";
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(-20, -38);
          ctx.lineTo(20, -38);
          ctx.lineTo(18, -64);
          ctx.lineTo(-16, -64);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          // 桶沿
          ctx.fillStyle = "#aab5ba";
          ctx.beginPath();
          ctx.roundRect(-22, -41, 44, 5, 2);
          ctx.fill();
          ctx.strokeStyle = "#283239";
          ctx.lineWidth = 1.8;
          ctx.stroke();
          // 高光
          ctx.fillStyle = "rgba(255,255,255,.45)";
          ctx.beginPath();
          ctx.rect(-12, -62, 5, 22);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,.2)";
          ctx.beginPath();
          ctx.rect(8, -60, 4, 20);
          ctx.fill();
          // 锈斑
          ctx.fillStyle = "rgba(122,74,30,.4)";
          ctx.beginPath();
          ctx.arc(-8, -48, 3, 0, Math.PI * 2);
          ctx.arc(6, -56, 2.4, 0, Math.PI * 2);
          ctx.arc(-14, -58, 2, 0, Math.PI * 2);
          ctx.fill();
        }

        // 旗帜僵尸：举旗
        if (z.flag) {
          ctx.strokeStyle = "#5d4220";
          ctx.lineWidth = 3.4;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(28, -20);
          ctx.lineTo(28, -58);
          ctx.stroke();
          ctx.fillStyle = "#5d4220";
          ctx.beginPath();
          ctx.arc(28, -58, 2.6, 0, Math.PI * 2);
          ctx.fill();
          const wave = Math.sin(now * .012) * 4;
          const flagG = ctx.createLinearGradient(28, -58, 54, -44);
          flagG.addColorStop(0, "#d8432f");
          flagG.addColorStop(1, "#a92a1c");
          ctx.fillStyle = flagG;
          ctx.strokeStyle = "#7c1c10";
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(28, -58);
          ctx.quadraticCurveTo(46 + wave, -52, 54, -46);
          ctx.lineTo(28, -42);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          // 旗面徽标
          ctx.fillStyle = "#f5d76e";
          ctx.beginPath();
          ctx.arc(41, -50, 3.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#2b1a0a";
          ctx.beginPath();
          ctx.arc(41, -50, 1.4, 0, Math.PI * 2);
          ctx.fill();
        }

        // 撑杆跳僵尸：红色头带（PvZ 特征）+ 持杆
        if (z.pole) {
          ctx.fillStyle = "#c23b2e";
          ctx.beginPath();
          ctx.ellipse(0, -44, 20, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#c23b2e";
          ctx.lineWidth = 3;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(-18, -44);
          ctx.quadraticCurveTo(-26, -48, -30, -46);
          ctx.stroke();
        }
        if (z.pole && !z.poleUsed && z.jumpState === 0) {
          ctx.strokeStyle = "#a9713b";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(-24, 16);
          ctx.quadraticCurveTo(-40, -20, -18, -52);
          ctx.stroke();
        } else if (z.pole && z.jumpState === 1) {
          ctx.strokeStyle = "#a9713b";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(-10, 10);
          ctx.lineTo(-6, -60);
          ctx.stroke();
        }

        ctx.restore();

        // 血条
        if (z.hp < z.maxHp) {
          const w = 48;
          const pct = Math.max(0, z.hp / z.maxHp);
          ctx.fillStyle = "rgba(0,0,0,.45)";
          ctx.beginPath();
          ctx.roundRect(-w / 2, -88, w, 6, 3);
          ctx.fill();
          ctx.fillStyle = pct > .5 ? "#7ed957" : pct > .25 ? "#f6c945" : "#e74c3c";
          ctx.beginPath();
          ctx.roundRect(-w / 2 + 1, -87, (w - 2) * pct, 4, 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawProjectile(pr) {
        ctx.save();
        ctx.translate(pr.x, pr.y);
        if (pr.slow) {
          const iceGrad = ctx.createRadialGradient(-2, -2, 1, 0, 0, 10);
          iceGrad.addColorStop(0, "#f0fbff");
          iceGrad.addColorStop(.45, "#a9e5ff");
          iceGrad.addColorStop(1, "#4fa7d5");
          ctx.fillStyle = iceGrad;
          ctx.strokeStyle = "#2e8fb8";
        } else {
          const peaGrad = ctx.createRadialGradient(-2, -2, 1, 0, 0, 10);
          peaGrad.addColorStop(0, pr.boosted ? "#eaffc7" : "#d7f5a4");
          peaGrad.addColorStop(.5, pr.boosted ? "#b7ff73" : "#5fc14a");
          peaGrad.addColorStop(1, pr.boosted ? "#65bd38" : "#2e7834");
          ctx.fillStyle = peaGrad;
          ctx.strokeStyle = pr.boosted ? "#3d8f25" : "#2e7834";
        }
        // 运动尾迹
        ctx.fillStyle = "rgba(255,255,255,.22)";
        ctx.beginPath();
        ctx.ellipse(-7, 0, 6, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, pr.boosted ? 9 : 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,.72)";
        ctx.beginPath();
        ctx.arc(-2, -2, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawSun(s) {
        const pulse = s.collectable ? Math.sin(elapsed * 5 + s.id) * 2 : 0;
        drawSunIcon(s.x, s.y, 16 + pulse);
        if (s.collectable) {
          ctx.save();
          ctx.fillStyle = "rgba(255, 232, 125, .16)";
          ctx.beginPath();
          ctx.arc(s.x, s.y, 31, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawParticles() {
        for (const p of particles) {
          const alpha = Math.max(0, p.life / p.maxLife);
          ctx.globalAlpha = alpha;
          if (p.text) {
            ctx.fillStyle = p.color;
            ctx.font = `800 ${p.size}px "Microsoft YaHei"`;
            ctx.textAlign = "center";
            ctx.fillText(p.text, p.x, p.y);
          } else {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.globalAlpha = 1;
      }

      function drawSelectionHint() {
        if (!selectedTool) return;
        ctx.fillStyle = "rgba(255,255,255,.92)";
        ctx.font = "800 18px 'Microsoft YaHei'";
        ctx.textAlign = "center";
        let hint = "";
        if (selectedTool === "shovel") hint = "点击要铲除的植物";
        else if (selectedTool === "energy") hint = "点击要充能的植物";
        else hint = `选择草坪种植：${PLANT_DEFS[selectedTool].name}`;
        ctx.fillText(hint, GAME_W / 2, 34);
      }

      function render() {
        drawLawn();
        // 画家算法：按行深度排序，近处后绘制（遮挡远处）
        const sortedPlants = [...plants].sort((a, b) => a.row - b.row);
        const sortedZombies = [...zombies].sort((a, b) => a.row - b.row);
        for (const p of sortedPlants) drawPlant(p);
        for (const pr of projectiles) drawProjectile(pr);
        for (const s of suns) drawSun(s);
        for (const z of sortedZombies) drawZombie(z);
        drawParticles();
        drawSelectionHint();

        // 底部战况
        ctx.fillStyle = "rgba(22, 34, 18, .68)";
        ctx.fillRect(0, GAME_H - 34, GAME_W, 34);
        ctx.fillStyle = "#ffe8a3";
        ctx.font = "800 15px 'Microsoft YaHei'";
        ctx.textAlign = "left";
        const remaining = zombies.length + (waveIndex < WAVES.length
          ? WAVES.slice(waveIndex).reduce((n, w) => n + w.spawns.filter(s => !s.spawned).length, 0)
          : 0);
        const mins = Math.floor(elapsed / 60);
        const secs = Math.floor(elapsed % 60);
        ctx.fillText(`阳光 ${Math.floor(sun)}   |   场上僵尸 ${zombies.length}   |   剩余敌人 ${remaining}   |   时间 ${mins}:${secs < 10 ? "0" + secs : secs}`, 14, GAME_H - 11);

        if (!energyReady && energyUsed) {
          ctx.textAlign = "right";
          ctx.fillStyle = "#8be6ff";
          ctx.fillText("能量豆已消耗，本关只能使用一次", GAME_W - 14, GAME_H - 11);
        }
      }

      function loop(now) {
        if (state === "playing") {
          const dt = now - lastFrame;
          lastFrame = now;
          update(dt);
          render();
          requestAnimationFrame(loop);
        } else if (state === "menu" || state === "won" || state === "lost") {
          render();
        }
      }

      // 初始化 UI
      createSeedCards();
      updateSunUI();
      updateToolButtons();
      updateMusicButton();
      fitViewport();

      canvas.addEventListener("click", handleBoardClick);
      canvas.addEventListener("contextmenu", e => {
        e.preventDefault();
        handleCancel(e);
      });
      canvas.addEventListener("touchstart", e => {
        e.preventDefault();
        handleBoardClick(e);
      }, { passive: false });

      shovelBtn.addEventListener("click", () => selectTool("shovel"));
      energyBtn.addEventListener("click", () => selectTool("energy"));
      musicBtn.addEventListener("click", () => {
        musicOn = !musicOn;
        if (musicOn) {
          ensureAudio();
          startMusic();
        } else {
          stopMusic();
        }
        updateMusicButton();
      });
      document.getElementById("startBtn").addEventListener("click", startGame);
      document.getElementById("restartBtn").addEventListener("click", () => {
        resetGame();
        requestAnimationFrame(loop);
      });

      window.addEventListener("keydown", e => {
        if (e.key === "Escape") {
          selectedTool = null;
          updateCards();
          updateToolButtons();
        }
      });

      render();
    })();
  </script>
</body>
</html>
