<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>植物大战僵尸 · 网页版</title>
  <style>
    :root {
      --grass-dark: #6fae4a;
      --grass-light: #8cc95c;
      --sun: #ffd34e;
      --wood: #8a5a3b;
      --ui-dark: #2f2618;
      --ui-light: #f8e8b0;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overscroll-behavior: none;
      background:
        radial-gradient(circle at 20% 15%, rgba(255, 241, 170, .18), transparent 32rem),
        radial-gradient(circle at 80% 20%, rgba(140, 201, 92, .18), transparent 34rem),
        linear-gradient(180deg, #1c3a1f 0%, #173419 55%, #0f2813 100%);
      color: #fff;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }

    .game-shell {
      width: min(1180px, 96vw);
      margin: auto;
      background: rgba(9, 24, 11, .72);
      border: 3px solid #4c3b22;
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
      overflow: hidden;
    }

    .topbar {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, 0) 60%),
        linear-gradient(90deg, #2d2518, #4b3a22 52%, #2d2518);
      border-bottom: 2px solid #6b5231;
      min-height: 96px;
    }

    .sun-counter {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 112px;
      height: 54px;
      padding: 0 13px;
      background: #241c12;
      border: 2px solid #6c5229;
      border-radius: 12px;
      font-size: 25px;
      font-weight: 800;
      color: #ffe8a3;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, .35);
    }

    .sun-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 32%, #fff6c0, var(--sun) 42%, #d99313 100%);
      box-shadow: 0 0 18px rgba(255, 211, 78, .65);
      animation: sun-pulse 2.2s ease-in-out infinite;
    }

    @keyframes sun-pulse {
      50% { transform: scale(1.08); }
    }

    .seed-bank {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 8px;
    }

    .seed-card {
      position: relative;
      flex: 0 0 auto;
      width: 82px;
      height: 82px;
      border: 2px solid #2b2117;
      border-radius: 10px;
      background: linear-gradient(145deg, #e9d49a, #b98a4b);
      box-shadow: 0 3px 8px rgba(0, 0, 0, .35);
      cursor: pointer;
      overflow: hidden;
      transition: transform .12s ease, filter .12s ease;
    }

    .seed-card:hover {
      transform: translateY(-3px);
      filter: brightness(1.06);
    }

    .seed-card.selected {
      outline: 4px solid #ffe071;
      outline-offset: -2px;
      box-shadow: 0 0 22px rgba(255, 224, 113, .75);
    }

    .seed-card.disabled {
      filter: grayscale(.75) brightness(.72);
      cursor: not-allowed;
    }

    .card-art {
      position: absolute;
      inset: 7px 7px 19px;
      border-radius: 7px;
      background: rgba(48, 32, 17, .12);
    }

    .card-art svg {
      width: 100%;
      height: 100%;
    }

    .card-cost {
      position: absolute;
      left: 5px;
      bottom: 3px;
      font-size: 15px;
      font-weight: 800;
      color: #21170c;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .35);
    }

    .card-name {
      position: absolute;
      right: 4px;
      bottom: 4px;
      max-width: 45px;
      text-align: right;
      font-size: 12px;
      font-weight: 700;
      color: #2d2215;
      line-height: 1;
    }

    .cooldown-mask {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(12, 12, 12, .88), rgba(0, 0, 0, .78));
      pointer-events: none;
      transform-origin: top;
    }

    .tool-buttons {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      align-items: center;
    }

    .tool-row {
      display: flex;
      gap: 7px;
    }

    .tool-btn {
      position: relative;
      width: 66px;
      height: 42px;
      border: 2px solid #251d14;
      border-radius: 9px;
      background: linear-gradient(180deg, #e6d099, #a9763e);
      cursor: pointer;
      font-weight: 800;
      color: #2e2112;
      box-shadow: 0 3px 7px rgba(0, 0, 0, .35);
      transition: transform .1s ease;
    }

    .tool-btn:hover {
      transform: translateY(-2px);
    }

    .tool-btn.selected {
      outline: 3px solid #ffe071;
      box-shadow: 0 0 18px rgba(255, 224, 113, .65);
    }

    .tool-btn:disabled {
      cursor: not-allowed;
      filter: grayscale(.75) brightness(.68);
    }

    .energy-btn {
      background:
        radial-gradient(circle at 35% 30%, #fff9d8, #45c8ff 42%, #1478c8 100%);
      color: #0d3f68;
      font-size: 12px;
    }

    .music-btn {
      background: linear-gradient(180deg, #e7d9a8, #b98a4b);
      color: #2f2112;
      font-size: 12px;
    }

    .music-btn.off {
      filter: grayscale(.75) brightness(.72);
    }

    .energy-btn.ready {
      animation: energy-glow 1.5s ease-in-out infinite;
    }

    @keyframes energy-glow {
      50% { box-shadow: 0 0 18px rgba(85, 200, 255, .85); }
    }

    .shovel-btn {
      font-size: 24px;
    }

    .canvas-wrap {
      position: relative;
      background: #26411f;
      display: grid;
      place-items: center;
      padding: 8px;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 1140px;
      height: auto;
      border-radius: 10px;
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .35);
      background: #5b9942;
      cursor: crosshair;
      touch-action: manipulation;
    }

    .overlay {
      position: absolute;
      inset: 8px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(13, 27, 12, .7);
      border-radius: 10px;
      backdrop-filter: blur(3px);
    }

    .overlay-panel {
      max-width: 620px;
      padding: 28px 34px;
      text-align: center;
      background: linear-gradient(180deg, #f5e8bf, #d8b977);
      color: #2c2013;
      border: 4px solid #7a5a30;
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, .45);
    }

    .overlay-panel h1 {
      margin: 0 0 10px;
      font-size: 38px;
      letter-spacing: 2px;
      color: #4c3014;
    }

    .overlay-panel h2 {
      margin: 0 0 12px;
      font-size: 34px;
      color: #4c3014;
    }

    .overlay-panel p {
      line-height: 1.7;
      font-size: 15px;
      color: #4a3a26;
      margin: 8px 0;
    }

    .big-btn {
      margin-top: 18px;
      padding: 12px 28px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, #76b947, #3d7f2d);
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 0 #245218, 0 12px 20px rgba(0, 0, 0, .25);
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .big-btn:hover {
      transform: translateY(-2px);
    }

    .big-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #245218, 0 6px 12px rgba(0, 0, 0, .25);
    }

    .wave-msg {
      position: absolute;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%);
      padding: 10px 26px;
      background: rgba(38, 24, 10, .9);
      color: #ffe5a0;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3px;
      border-radius: 12px;
      pointer-events: none;
      animation: wave-msg 2.4s ease forwards;
      z-index: 4;
    }

    @keyframes wave-msg {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.7); }
      15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.08); }
    }

    .hidden {
      display: none !important;
    }

    /* ===== 移动端适配（含手机横屏：断点放宽到 980px，顶栏自动换行）===== */
    @media (max-width: 980px) {
      body {
        padding: 6px;
        padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
        align-items: center;
      }

      .game-shell {
        width: 100%;
        border-radius: 10px;
        border-width: 2px;
      }

      .topbar {
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px 10px;
        min-height: 0;
      }

      .sun-counter {
        min-width: 88px;
        height: 42px;
        font-size: 19px;
        padding: 0 9px;
        gap: 6px;
      }

      .sun-icon {
        width: 25px;
        height: 25px;
      }

      .tool-buttons {
        flex-direction: row;
        margin-left: auto;
        gap: 6px;
      }

      .tool-row {
        gap: 6px;
      }

      .tool-btn {
        width: 48px;
        height: 42px;
        font-size: 18px;
      }

      #musicBtn,
      #waveLabel {
        height: 42px;
        padding: 0 7px;
        font-size: 11px;
      }

      .seed-bank {
        order: 3;
        flex-basis: 100%;
        gap: 6px;
        padding: 2px 0 6px;
      }

      .seed-card {
        width: 58px;
        height: 58px;
        border-radius: 8px;
      }

      .card-cost {
        font-size: 13px;
      }

      .card-name {
        font-size: 10px;
        max-width: 36px;
      }

      .canvas-wrap {
        padding: 4px;
      }

      canvas {
        border-radius: 6px;
      }

      .overlay {
        inset: 4px;
        border-radius: 6px;
      }

      .overlay-panel {
        padding: 18px 14px;
        max-width: 92vw;
      }

      .overlay-panel h1 {
        font-size: 26px;
      }

      .overlay-panel h2 {
        font-size: 24px;
      }

      .overlay-panel p {
        font-size: 13px;
        line-height: 1.6;
      }

      .big-btn {
        font-size: 18px;
        padding: 10px 22px;
      }

      .wave-msg {
        font-size: 18px;
        padding: 8px 16px;
      }
    }

    /* 矮屏横屏（如手机横放）：进一步压缩顶栏，画布高度由 JS 适配 */
    @media (max-height: 500px) and (orientation: landscape) {
      body {
        padding: 4px;
      }

      .topbar {
        padding: 4px 8px;
        gap: 6px;
      }

      .seed-card {
        width: 50px;
        height: 50px;
      }

      .card-cost {
        font-size: 11px;
      }

      .card-name {
        font-size: 9px;
      }

      .sun-counter {
        height: 36px;
        min-width: 78px;
        font-size: 16px;
      }

      .tool-btn {
        width: 44px;
        height: 36px;
      }

      #musicBtn,
      #waveLabel {
        height: 36px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <section class="topbar">
      <div class="sun-counter">
        <div class="sun-icon" aria-hidden="true"></div>
        <span id="sunAmount">150</span>
      </div>

      <div class="seed-bank" id="seedBank"></div>

      <div class="tool-buttons">
        <div class="tool-row">
          <button class="tool-btn shovel-btn" id="shovelBtn" title="铲子：移除植物">🪏</button>
          <button class="tool-btn energy-btn" id="energyBtn" title="能量豆：给植物充能">⚡</button>
        </div>
        <button class="tool-btn music-btn" id="musicBtn" style="width:auto;height:34px;padding:0 10px;font-size:12px;">音乐:开</button>
        <button class="tool-btn" id="waveLabel" style="width:auto;height:34px;padding:0 10px;font-size:13px;">第 1 / 5 波</button>
      </div>
    </section>

    <section class="canvas-wrap">
      <canvas id="gameCanvas" width="1100" height="620" aria-label="植物大战僵尸游戏场地"></canvas>

      <div class="overlay" id="startOverlay">
        <div class="overlay-panel">
          <h1>植物大战僵尸</h1>
          <p>网页版 · 5 波守家战</p>
          <p>点击上方卡牌选择植物，再点击草坪种植。<br>点击掉落的阳光进行收集，守住最左侧的房屋。</p>
          <p><strong>创新玩法：</strong>“能量豆”可为任意植物充能，<br>豌豆狂暴、向日葵爆发产阳、坚果回血。</p>
          <p><strong>新增单位：</strong>双发射手、土豆雷、火爆辣椒；<br>旗帜僵尸领队、撑杆跳僵尸会跳过你的防线，<br>路障与铁桶会在受损时“哐当”脱落。</p>
          <button class="big-btn" id="startBtn">开始游戏</button>
        </div>
      </div>

      <div class="overlay hidden" id="endOverlay">
        <div class="overlay-panel">
          <h2 id="endTitle">胜利！</h2>
          <p id="endText">你守住了草坪。</p>
          <button class="big-btn" id="restartBtn">再玩一次</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      if (!ctx.roundRect) {
        ctx.roundRect = function(x, y, w, h, r) {
          r = Math.min(r, w / 2, h / 2);
          this.moveTo(x + r, y);
          this.arcTo(x + w, y, x + w, y + h, r);
          this.arcTo(x + w, y + h, x, y + h, r);
          this.arcTo(x, y + h, x, y, r);
          this.arcTo(x, y, x + w, y, r);
          this.closePath();
          return this;
        };
      }

      // 逻辑分辨率固定 1100×620；物理像素按设备像素比放大（高清屏更清晰）
      const GAME_W = 1100;
      const GAME_H = 620;
      const DPR = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = GAME_W * DPR;
      canvas.height = GAME_H * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

      // 视口适配：让整个游戏（顶栏+棋盘）在手机横/竖屏下都完整可见、无横向溢出
      function fitViewport() {
        const wrap = canvas.parentElement;
        const top = document.querySelector(".topbar");
        if (!wrap || !top) return;
        const availW = wrap.clientWidth;
        const availH = Math.max(160, window.innerHeight - top.offsetHeight - 24);
        const byWidthH = availW * (GAME_H / GAME_W);
        if (byWidthH <= availH) {
          // 宽度受限（竖屏）：按宽度铺满，高度自适应
          canvas.style.width = "100%";
          canvas.style.height = "auto";
        } else {
          // 高度受限（横屏）：按可用高度缩放，保持宽高比
          canvas.style.height = Math.floor(availH) + "px";
          canvas.style.width = "auto";
        }
      }
      window.addEventListener("resize", fitViewport);
      window.addEventListener("orientationchange", fitViewport);
      window.addEventListener("load", fitViewport);

      const seedBankEl = document.getElementById("seedBank");
      const sunAmountEl = document.getElementById("sunAmount");
      const shovelBtn = document.getElementById("shovelBtn");
      const energyBtn = document.getElementById("energyBtn");
      const musicBtn = document.getElementById("musicBtn");
      const waveLabel = document.getElementById("waveLabel");
      const startOverlay = document.getElementById("startOverlay");
      const endOverlay = document.getElementById("endOverlay");
      const endTitle = document.getElementById("endTitle");
      const endText = document.getElementById("endText");

      const COLS = 9;
      const ROWS = 5;
      const BOARD_X = 245;
      const BOARD_Y = 80;
      const CELL_W = 88;
      const CELL_H = 100;
      const HOUSE_X = 148;
      const MOWER_X = 205;

      const PLANT_DEFS = {
        sunflower: {
          name: "向日葵",
          cost: 50,
          hp: 300,
          cooldown: 6500,
          produceInterval: 8000,
          color: "#f7c948",
          cardColor: "#f7c948"
        },
        peashooter: {
          name: "豌豆射手",
          cost: 100,
          hp: 300,
          cooldown: 6500,
          shootInterval: 1300,
          damage: 25,
          color: "#65b945",
          cardColor: "#65b945"
        },
        snowpea: {
          name: "寒冰射手",
          cost: 175,
          hp: 300,
          cooldown: 6500,
          shootInterval: 1400,
          damage: 25,
          slow: true,
          color: "#7cc9f2",
          cardColor: "#8fd7ff"
        },
        wallnut: {
          name: "坚果墙",
          cost: 50,
          hp: 4000,
          cooldown: 18000,
          color: "#b57a3c",
          cardColor: "#c98d4b"
        },
        cherrybomb: {
          name: "樱桃炸弹",
          cost: 150,
          hp: 100,
          cooldown: 28000,
          fuse: 1150,
          damage: 1800,
          radius: 150,
          color: "#e84b3e",
          cardColor: "#e84b3e"
        },
        repeater: {
          name: "双发射手",
          cost: 200,
          hp: 300,
          cooldown: 7000,
          shootInterval: 1300,
          damage: 25,
          volley: 2,
          color: "#7ac74f",
          cardColor: "#7ac74f"
        },
        potatomine: {
          name: "土豆雷",
          cost: 25,
          hp: 300,
          cooldown: 30000,
          armTime: 9000,
          damage: 1800,
          radius: 115,
          color: "#c9a45c",
          cardColor: "#d8b06a"
        },
        jalapeno: {
          name: "火爆辣椒",
          cost: 125,
          hp: 100,
          cooldown: 45000,
          fuse: 480,
          damage: 99999,
          color: "#f2593b",
          cardColor: "#f2593b"
        }
      };

      const ZOMBIE_DEFS = {
        normal: { name: "普通僵尸", hp: 200, speed: 22, damage: 20, eatInterval: 700, bodyHp: 200 },
        flag: { name: "旗帜僵尸", hp: 230, speed: 24, damage: 20, eatInterval: 700, bodyHp: 230, flag: true },
        cone: { name: "路障僵尸", hp: 560, speed: 22, damage: 20, eatInterval: 700, hat: "cone", bodyHp: 200 },
        bucket: { name: "铁桶僵尸", hp: 1100, speed: 18, damage: 25, eatInterval: 760, hat: "bucket", bodyHp: 200 },
        pole: { name: "撑杆跳僵尸", hp: 240, speed: 34, damage: 20, eatInterval: 700, bodyHp: 240, pole: true }
      };

      const WAVES = [
        {
          label: "第 1 波：先遣队",
          spawns: [
            { type: "flag", row: 2, delay: 300 },
            { type: "normal", row: 1, delay: 2000 },
            { type: "normal", row: 3, delay: 4200 },
            { type: "normal", row: 0, delay: 6500 },
            { type: "normal", row: 4, delay: 8800 },
            { type: "normal", row: 2, delay: 11200 }
          ]
        },
        {
          label: "第 2 波：路障来袭",
          spawns: [
            { type: "flag", row: 3, delay: 300 },
            { type: "normal", row: 2, delay: 1600 },
            { type: "normal", row: 1, delay: 3600 },
            { type: "cone", row: 3, delay: 5800 },
            { type: "normal", row: 0, delay: 8000 },
            { type: "cone", row: 4, delay: 10200 },
            { type: "normal", row: 2, delay: 12600 }
          ]
        },
        {
          label: "第 3 波：撑杆跳突袭",
          spawns: [
            { type: "flag", row: 1, delay: 300 },
            { type: "normal", row: 0, delay: 1800 },
            { type: "pole", row: 1, delay: 4000 },
            { type: "normal", row: 3, delay: 6200 },
            { type: "pole", row: 4, delay: 8400 },
            { type: "cone", row: 2, delay: 10800 },
            { type: "normal", row: 1, delay: 13200 }
          ]
        },
        {
          label: "第 4 波：铁桶军团",
          spawns: [
            { type: "flag", row: 4, delay: 300 },
            { type: "normal", row: 2, delay: 1400 },
            { type: "cone", row: 1, delay: 3400 },
            { type: "bucket", row: 3, delay: 5600 },
            { type: "normal", row: 0, delay: 7800 },
            { type: "cone", row: 4, delay: 10000 },
            { type: "bucket", row: 2, delay: 12200 },
            { type: "pole", row: 1, delay: 14600 }
          ]
        },
        {
          label: "第 5 波：最终决战",
          spawns: [
            { type: "flag", row: 2, delay: 300 },
            { type: "normal", row: 0, delay: 1200 },
            { type: "pole", row: 2, delay: 3200 },

      const NOTE_MAP = {};
      (function buildNotes() {
        const names = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        for (let octave = 1; octave <= 7; octave++) {
          for (let i = 0; i < names.length; i++) {
            const midi = 12 * (octave + 1) + i;
            NOTE_MAP[`${names[i]}${octave}`] = 440 * Math.pow(2, (midi - 69) / 12);
          }
        }
      })();

      function ensureAudio() {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
          masterGain = audioCtx.createGain();
          masterGain.gain.value = .65;
          masterGain.connect(audioCtx.destination);
          musicGain = audioCtx.createGain();
          musicGain.gain.value = .5;
          musicGain.connect(masterGain);
          sfxGain = audioCtx.createGain();
          sfxGain.gain.value = .3;
          sfxGain.connect(masterGain);
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
      }

      function tone(freq, start, dur, type, gainNode, volume, endFreq) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, start);
        if (endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(30, endFreq), start + dur);
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(volume, start + .012);
        g.gain.exponentialRampToValueAtTime(.0001, start + dur);
        osc.connect(g);
        g.connect(gainNode);
        osc.start(start);
        osc.stop(start + dur + .03);
      }

      function getNoise() {
        if (!noiseBuf && audioCtx) {
          noiseBuf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * .5), audioCtx.sampleRate);
          const d = noiseBuf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        return noiseBuf;

      function playKick(t) {
        if (!audioCtx) return;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(150, t);
        o.frequency.exponentialRampToValueAtTime(46, t + .11);
        g.gain.setValueAtTime(.0001, t);
        g.gain.exponentialRampToValueAtTime(.5, t + .008);
        g.gain.exponentialRampToValueAtTime(.0001, t + .13);
        o.connect(g);
        g.connect(musicGain);
        o.start(t);
        o.stop(t + .15);
      }

      function playSnare(t) {
        if (!audioCtx) return;
        const src = audioCtx.createBufferSource();
        src.buffer = getNoise();
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(.0001, t);
        g.gain.exponentialRampToValueAtTime(.24, t + .005);
        g.gain.exponentialRampToValueAtTime(.0001, t + .12);
        const f = audioCtx.createBiquadFilter();
        f.type = "highpass";
        f.frequency.value = 900;
        src.connect(f);
        f.connect(g);
        g.connect(musicGain);
        src.start(t);
        src.stop(t + .14);
      }

      function playHat(t) {
        if (!audioCtx) return;
        const src = audioCtx.createBufferSource();
        src.buffer = getNoise();
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(.0001, t);
        g.gain.exponentialRampToValueAtTime(.09, t + .004);
        g.gain.exponentialRampToValueAtTime(.0001, t + .04);
        const f = audioCtx.createBiquadFilter();
        f.type = "highpass";
        f.frequency.value = 6000;
        src.connect(f);
        f.connect(g);
        g.connect(musicGain);
        src.start(t);
        src.stop(t + .05);

      function scheduleStepAt(step, t, track, stepDur) {
        const bar = Math.floor(step / 16);
        const pos = step % 16;

        // 低音（8 分音符）
        if (track.bass) {
          const notes = track.bass.notes;
          const idx = Math.floor(pos / 2) % notes.length;
          const n = notes[idx];
          if (n && NOTE_MAP[n]) {
            tone(NOTE_MAP[n], t, stepDur * 1.7, track.bass.wave || "triangle", musicGain, track.bass.vol || .16);
          }
        }

        // 旋律（16 分音符）
        if (track.melody) {
          const steps = track.melody.steps;
          const n = steps[bar % steps.length][pos];
          if (n && NOTE_MAP[n]) {
            const dur = stepDur * (track.melody.hold || 1);
            tone(NOTE_MAP[n], t, dur, track.melody.wave || "triangle", musicGain, track.melody.vol || .12);
          }
        }

        // 鼓组
        if (track.drums) {
          const d = track.drums;
          if (d.kick.includes(pos)) playKick(t);
          if (d.snare.includes(pos)) playSnare(t);
          if (d.hat.includes(pos)) playHat(t);
        }
      }

      function musicScheduler() {
        if (!audioCtx || !musicOn || audioCtx.state !== "running") return;
        const track = MUSIC[musicMode];
        if (!track) return;
        const stepDur = 60 / track.bpm / 4;
        const swing = track.swing || 0;
        while (nextNoteTime < audioCtx.currentTime + .16) {
          scheduleStepAt(current16th, nextNoteTime, track, stepDur);
          nextNoteTime += stepDur * (current16th % 2 === 1 ? (1 + swing) : (1 - swing));
          current16th++;
        }
      }

      function startMusic() {
        if (!audioCtx || !musicOn) return;

        if (musicGain) {
          musicGain.gain.cancelScheduledValues(audioCtx.currentTime);
          musicGain.gain.setValueAtTime(.5, audioCtx.currentTime);
        }
        nextNoteTime = audioCtx.currentTime + .06;
        current16th = 0;
        musicScheduler();
        musicTimer = setInterval(musicScheduler, 30);

        if (musicTimer) {

            vx: Math.cos(angle) * vel,
            vy: Math.sin(angle) * vel - 35,
            life: 0.45 + Math.random() * 0.5,
            maxLife: 0.9,
            size: 2 + Math.random() * 4,
            color
          });
        }
      }

      function addTextParticle(x, y, text, color = "#fff") {
        particles.push({
          x,
          y,
          vx: 0,
          vy: -50,
          life: 0.9,
          maxLife: 0.9,
          size: 18,
          color,
          text
        });
      }

      function updateSunUI() {
        sunAmountEl.textContent = Math.floor(sun);
        updateCards();
      }

      function canAfford(type) {
        return sun >= plantCost(type);
      }

      function isCooldown(type) {
        return (cooldowns[type] || 0) > 0;
      }

      function setCooldown(type) {
        cooldowns[type] = PLANT_DEFS[type].cooldown;
      }

      function updateCooldowns(dt) {
        for (const key of Object.keys(cooldowns)) {
          cooldowns[key] = Math.max(0, cooldowns[key] - dt);
        }
      }

      function selectTool(tool) {
        if (tool && tool !== "shovel" && tool !== "energy") {
          if (!canAfford(tool) || isCooldown(tool)) return;
        }
        if (tool === "energy" && !energyReady) return;
        selectedTool = selectedTool === tool ? null : tool;
        updateCards();
        updateToolButtons();
      }

      function updateToolButtons() {
        shovelBtn.classList.toggle("selected", selectedTool === "shovel");
        energyBtn.classList.toggle("selected", selectedTool === "energy");
        energyBtn.classList.toggle("ready", energyReady);
        energyBtn.disabled = !energyReady;
      }

      function useShovel(row, col) {
        const idx = plants.findIndex(p => p.row === row && p.col === col);
        if (idx < 0) return;
        const p = plants[idx];
        addParticles(p.x, p.y, "#c9a05b", 10, 90);
        plants.splice(idx, 1);
        selectedTool = null;
        updateToolButtons();
      }

      function useEnergy(row, col) {
        const p = getPlantAt(row, col);
        if (!p) return;
        const now = elapsed * 1000;
        p.boostedUntil = now + 5000;
        p.boostVisual = 1;
        energyReady = false;
        energyUsed = true;
        addTextParticle(p.x, p.y - 40, "+能量", "#8be6ff");

        if (p.type === "sunflower") {
          sun += 50;
          p.produceTimer = 0;
          addTextParticle(p.x, p.y - 64, "+50", "#ffe17a");
          playSfx("sun");
        } else if (p.type === "wallnut") {
          p.hp = Math.min(p.maxHp + 1200, p.hp + 1200);
          p.maxHp += 1200;
          addTextParticle(p.x, p.y - 58, "装甲+", "#e9c58b");
        } else if (p.type === "cherrybomb") {
          p.fuseTimer = Math.min(p.fuseTimer, 220);
          addTextParticle(p.x, p.y - 58, "速爆", "#ff9a8a");
        } else if (p.type === "potatomine") {
          p.armed = true;
          p.armTimer = 0;
          addTextParticle(p.x, p.y - 58, "已就绪!", "#ffd76a");
          playSfx("arm");
        } else if (p.type === "jalapeno") {
          p.fuseTimer = Math.min(p.fuseTimer, 60);
          addTextParticle(p.x, p.y - 58, "速爆", "#ff9a8a");
        }
        updateSunUI();
        selectedTool = null;
        updateToolButtons();
        energyBtn.textContent = "已用";
      }

      function startWave(index) {
        waveIndex = index;
        waveStarted = true;
        waveStartTime = elapsed * 1000;
        waveMessage = WAVES[index].label;
        spawnWaveMessage(waveMessage);
        waveLabel.textContent = `第 ${index + 1} / ${WAVES.length} 波`;
        playSfx("wave");
        if (musicMode !== "wave") setMusicMode("wave");
        window.setTimeout(() => {
          if (state === "playing") setMusicMode("level");
        }, 2200);
      }

      function spawnWaveMessage(text) {
        const existing = document.querySelector(".wave-msg");
        if (existing) existing.remove();
        const div = document.createElement("div");
        div.className = "wave-msg";
        div.textContent = text;
        document.querySelector(".canvas-wrap").appendChild(div);
        window.setTimeout(() => div.remove(), 2500);
      }

      function spawnWaveSpawns(wave, dtMs) {
        const waveElapsed = elapsed * 1000 - waveStartTime;
        for (const spawn of wave.spawns) {
          if (spawn.spawned) continue;
          if (waveElapsed >= spawn.delay) {
            spawn.spawned = true;
            spawnZombie(spawn.type, spawn.row);
          }
        }
      }

      function startGame() {
        ensureAudio();
        if (musicOn) {
          setMusicMode("level");
          startMusic();
        }
        playSfx("place");
        state = "playing";
        startOverlay.classList.add("hidden");
        endOverlay.classList.add("hidden");
        startWave(0);
        lastFrame = performance.now();
        requestAnimationFrame(loop);
      }

      function endGame(win) {
        if (state !== "playing") return;
        state = win ? "won" : "lost";
        setMusicMode(win ? "win" : "lose");
        playSfx(win ? "win" : "lose");
        endOverlay.classList.remove("hidden");
        endTitle.textContent = win ? "胜利！" : "僵尸闯入了房屋";
        const mins = Math.floor(elapsed / 60);
        const secs = Math.floor(elapsed % 60);
        endText.textContent = win
          ? `你守住了草坪！用时 ${mins} 分 ${secs} 秒，击杀 ${zombiesKilled} 只僵尸，收集阳光 ${sunCollected}。`
          : `击杀 ${zombiesKilled} 只僵尸，收集阳光 ${sunCollected}。调整阵型，再试一次吧。`;
      }

      function resetGame() {
        state = "menu";
        setMusicMode("menu");
        if (musicOn && audioCtx) startMusic();
        sun = 200;
        selectedTool = null;
        elapsed = 0;
        skySunTimer = 3000;
        energyReady = true;
        energyUsed = false;
        energyBtn.textContent = "⚡";
        waveIndex = 0;
        waveStarted = false;
        waveStartTime = 0;
        waveMessage = null;
        nextWaveTimer = 0;
        zombiesKilled = 0;
        sunCollected = 0;
        plants.length = 0;
        zombies.length = 0;
        projectiles.length = 0;
        suns.length = 0;
        particles.length = 0;
        for (const key of Object.keys(cooldowns)) delete cooldowns[key];
        for (let row = 0; row < ROWS; row++) {
          mowers[row] = { row, x: MOWER_X, active: true, moving: false, speed: 360 };
        }
        WAVES.forEach(wave => wave.spawns.forEach(s => { s.spawned = false; }));
        updateSunUI();
        updateToolButtons();
        waveLabel.textContent = `第 1 / ${WAVES.length} 波`;
        startOverlay.classList.remove("hidden");
        endOverlay.classList.add("hidden");
      }

      function updateCards() {
        for (const card of seedBankEl.querySelectorAll(".seed-card")) {
          const type = card.dataset.type;
          const disabled = !canAfford(type) || isCooldown(type);
          card.classList.toggle("disabled", disabled);
          card.classList.toggle("selected", selectedTool === type);
          const cd = cooldowns[type] || 0;
          const total = PLANT_DEFS[type].cooldown;
          const mask = card.querySelector(".cooldown-mask");
          const pct = cd > 0 ? Math.min(1, cd / total) : 0;
          mask.style.transform = `scaleY(${pct})`;
        }
      }

      function pointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = GAME_W / rect.width;
        const scaleY = GAME_H / rect.height;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      }

      function handleBoardClick(e) {
        if (state !== "playing") return;
        const pos = pointerPos(e);

        // 优先收集阳光
        for (let i = suns.length - 1; i >= 0; i--) {
          const s = suns[i];
          const dx = pos.x - s.x;
          const dy = pos.y - s.y;
          if (Math.hypot(dx, dy) < 38) {
            collectSun(s.id);
            return;
          }
        }

        const cell = pointToCell(pos.x, pos.y);
        if (!cell) return;

        if (selectedTool === "shovel") {
          useShovel(cell.row, cell.col);
          return;
        }

        if (selectedTool === "energy") {
          useEnergy(cell.row, cell.col);
          return;
        }

        if (selectedTool && PLANT_DEFS[selectedTool]) {
          if (getPlantAt(cell.row, cell.col)) return;
          if (!canAfford(selectedTool) || isCooldown(selectedTool)) return;
          sun -= plantCost(selectedTool);
          setCooldown(selectedTool);
          const plant = spawnPlant(selectedTool, cell.row, cell.col);
          addParticles(plant.x, plant.y + 28, "#a5d78a", 8, 70);
          playSfx("place");
          updateSunUI();
          selectedTool = null;
          updateToolButtons();
        }
      }

      function handleCancel(e) {
        if (e.button === 2) {
          selectedTool = null;
          updateCards();
          updateToolButtons();
        }
      }

      function update(dtMs) {
        if (state !== "playing") return;
        const dt = Math.min(dtMs, 50) / 1000;
        elapsed += dt;
        const nowMs = elapsed * 1000;

        updateCooldowns(dtMs);

        // 天空阳光
        skySunTimer -= dtMs;
        if (skySunTimer <= 0) {
          spawnSkySun();
          skySunTimer = 6500 + Math.random() * 2500;
        }

        // 波次生成
        if (waveStarted && waveIndex < WAVES.length) {
          spawnWaveSpawns(WAVES[waveIndex], dtMs);
          const wave = WAVES[waveIndex];
          const allSpawned = wave.spawns.every(s => s.spawned);
          if (allSpawned && zombies.length === 0 && waveIndex === WAVES.length - 1) {
            endGame(true);
            return;
          }
          if (allSpawned && zombies.length === 0 && waveIndex < WAVES.length - 1) {
            if (nextWaveTimer <= 0) {
              nextWaveTimer = 3600;
              spawnWaveMessage("下一波即将到来...");
            }
          }
        }
        if (nextWaveTimer > 0) {
          nextWaveTimer -= dtMs;
          if (nextWaveTimer <= 0 && waveIndex < WAVES.length - 1) {
            startWave(waveIndex + 1);
          }
        }

        // 植物逻辑
        for (const p of plants) {
          if (p.dead) continue;
          p.grow = Math.min(1, p.grow + dt * 2.6);
          p.recoil = Math.max(0, p.recoil - dt * 3);
          p.boostVisual = Math.max(0, p.boostVisual - dt * 1.5);
          const boosted = nowMs < p.boostedUntil;

          if (p.type === "sunflower") {
            const interval = boosted ? 2300 : PLANT_DEFS.sunflower.produceInterval;
            p.produceTimer -= dtMs;
            if (p.produceTimer <= 0) {
              p.produceTimer = interval;
              spawnPlantSun(p.x, p.y);
              addParticles(p.x, p.y - 30, "#ffe17a", 5, 55);
            }
          }

          if (p.type === "peashooter" || p.type === "snowpea" || p.type === "repeater") {
            const def = PLANT_DEFS[p.type];
            const interval = boosted ? def.shootInterval * 0.32 : def.shootInterval;
            const hasTarget = zombies.some(z => !z.dead && !z.dying && z.row === p.row && z.x > p.x + 12 && z.hp > 0);
            if (hasTarget) {
              p.shootTimer -= dtMs;
              if (p.shootTimer <= 0) {
                p.shootTimer = interval;
                p.recoil = 1;
                const slow = p.type === "snowpea";
                const volley = p.type === "repeater" ? 2 : 1;
                for (let v = 0; v < volley; v++) {
                  projectiles.push({
                    id: nextId++,
                    row: p.row,
                    x: p.x + 34 + v * 8,
                    y: p.y - 6 + (p.type === "repeater" ? (v === 0 ? 2 : -8) : 0),
                    speed: boosted ? 470 : 340,
                    damage: boosted ? def.damage * 2 : def.damage,
                    slow,
                    boosted
                  });
                }
                playSfx("shoot");
              }
            } else {
              p.shootTimer = Math.min(p.shootTimer, 150);
            }
          }

          if (p.type === "potatomine") {
            if (!p.armed) {
              p.armTimer -= dtMs;
              if (p.armTimer <= 0) {
                p.armed = true;
                addTextParticle(p.x, p.y - 40, "就绪", "#ffd76a");
                playSfx("arm");
              }
            } else {
              // 引爆：同列相邻僵尸踩上
              for (const z of zombies) {
                if (z.dead || z.dying || z.row !== p.row) continue;
                if (Math.abs(z.x - p.x) < 62) {
                  explodeMine(p);
                  p.dead = true;
                  break;
                }
              }
            }
          }

          if (p.type === "cherrybomb") {
            p.fuseTimer -= dtMs;
            if (p.fuseTimer <= 0) {
              explodeCherry(p);
              p.dead = true;
            }
          }

          if (p.type === "jalapeno") {
            p.fuseTimer -= dtMs;
            if (p.fuseTimer <= 0) {
              explodeJalapeno(p);
              p.dead = true;
            }
          }
        }

        // 删除已死植物
        for (let i = plants.length - 1; i >= 0; i--) {
          if (plants[i].dead) {
            plants.splice(i, 1);
          }
        }

        // 子弹
        for (const pr of projectiles) {
          pr.x += pr.speed * dt;
          let hit = false;
          for (const z of zombies) {
            if (z.dead || z.dying || z.row !== pr.row) continue;
            if (Math.abs(pr.x - z.x) < 28 && z.x > HOUSE_X) {
              z.hp -= pr.damage;
              if (pr.slow) z.slowUntil = nowMs + 4000;
              addParticles(pr.x, z.y - 20, pr.slow ? "#aeeaff" : "#a8e37f", 4, 65);
              hit = true;
              if (z.hp <= 0) {
                killZombie(z);
              } else {
                playSfx("hit");
              }
              break;
            }
          }
          if (hit) pr.dead = true;
        }
        for (let i = projectiles.length - 1; i >= 0; i--) {
          if (projectiles[i].dead || projectiles[i].x > GAME_W + 40) {
            projectiles.splice(i, 1);
          }
        }

        // 樱桃爆炸
        function explodeCherry(bomb) {
          addParticles(bomb.x, bomb.y, "#ff9a55", 28, 170);
          addParticles(bomb.x, bomb.y, "#ff5849", 22, 120);
          playSfx("explosion");
          for (const z of zombies) {
            if (z.dead || z.dying) continue;
            if (Math.hypot(z.x - bomb.x, z.y - bomb.y) < PLANT_DEFS.cherrybomb.radius) {
              z.hp -= PLANT_DEFS.cherrybomb.damage;
              if (z.hp <= 0) {
                killZombie(z, 16);
              }
            }
          }
        }

        // 土豆雷爆炸
        function explodeMine(mine) {
          playSfx("boom");
          addParticles(mine.x, mine.y - 6, "#c9a45c", 18, 150);
          addParticles(mine.x, mine.y - 6, "#ff9a55", 24, 190);
          for (const z of zombies) {
            if (z.dead || z.dying) continue;
            if (Math.hypot(z.x - mine.x, z.y - mine.y) < PLANT_DEFS.potatomine.radius) {
              z.hp -= PLANT_DEFS.potatomine.damage;
              if (z.hp <= 0) killZombie(z, 14);
            }
          }
        }

        // 火爆辣椒：整行清场
        function explodeJalapeno(pepper) {
          playSfx("boom");
          addParticles(pepper.x, pepper.y - 10, "#ff9a55", 30, 190);
          addParticles(pepper.x, pepper.y - 10, "#ff5849", 26, 150);
          for (let i = 0; i < 14; i++) {
            addParticles(BOARD_X + i * 80 + 40, plantRowY(pepper.row) + (Math.random() * 40 - 20), i % 2 ? "#ffb14a" : "#ff7a3c", 6, 120);
          }
          for (const z of zombies) {
            if (z.dead || z.dying || z.row !== pepper.row) continue;
            z.hp -= PLANT_DEFS.jalapeno.damage;
            killZombie(z, 14);
          }
        }

        // 僵尸逻辑
        for (const z of zombies) {
          if (z.dying) {
            z.deathTimer -= dtMs;
            if (z.deathTimer <= 0) z.dead = true;
            continue;
          }
          if (z.dead) continue;
          z.rise = Math.min(1, z.rise + dt * 1.6);
          const slowed = nowMs < z.slowUntil;
          const speedMult = slowed ? 0.52 : 1;

          // 帽子/装备在护甲耗尽后脱落
          if (z.hat && !z.hatBroken && z.hp <= z.bodyHp) {
            z.hatBroken = true;
            z.hat = null;
            addParticles(z.x, z.y - 44, z.type === "bucket" ? "#a5b1b8" : "#e78a35", 10, 110);
            addParticles(z.x, z.y - 56, z.type === "bucket" ? "#7f8a91" : "#ffb45b", 6, 80);
            playSfx("hatPop");
          }

          // 撑杆跳：接近植物时起跳，越过前方第一株植物
          if (z.pole && !z.poleUsed && z.jumpState === 0) {
            const f = getFrontPlant(z.row, z.x);
            if (f && z.x > f.x + 20 && z.x - f.x < 170) {
              z.jumpState = 1;
              z.jumpFrom = z.x;
              z.jumpTarget = Math.max(HOUSE_X + 40, f.x - 52);
              z.jumpT = 0;
              z.poleUsed = true;
              playSfx("jump");
            }
          }

          if (z.jumpState === 1) {
            z.jumpT += dt;
            const dur = .52;
            const p = Math.min(1, z.jumpT / dur);
            const ease = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
            z.x = z.jumpFrom + (z.jumpTarget - z.jumpFrom) * ease;
            z.walkPhase += dt * 9;
            z.eating = false;
            if (p >= 1) {
              z.jumpState = 0;
              addParticles(z.x, z.y + 12, "#a98855", 8, 60);
            }
            // 跳跃期间不触发割草机/房屋判定以外逻辑
          } else {
            const front = getFrontPlant(z.row, z.x);

            if (front) {
              z.eating = true;
              z.x += Math.min(0, front.x + 40 - z.x);
              z.eatPhase += dt * 14;
              z.eatTimer -= dtMs;
              if (z.eatTimer <= 0) {
                z.eatTimer = z.eatInterval;
                front.hp -= z.damage;
                playSfx("eat");
                if (front.hp <= 0) {
                  front.dead = true;
                  addParticles(front.x, front.y, "#8fbf5e", 12, 90);
                }
              }
            } else {
              z.eating = false;
              z.eatPhase = Math.max(0, z.eatPhase - dt * 8);
              z.eatTimer = Math.min(z.eatTimer, 120);
              z.x -= z.speed * speedMult * dt;
            }

            z.walkPhase += dt * 9;

            // 触发割草机
            const mower = mowers[z.row];
            if (mower.active && !mower.moving && z.x < mower.x + 34) {
              mower.moving = true;
              mower.active = false;
              addTextParticle(mower.x, mower.y - 40, "割草机！", "#f5e58a");
              playSfx("mower");
            }
          }

          // 进入房屋
          if (z.x <= HOUSE_X) {
            killZombie(z, 10);
            endGame(false);
          }
        }

        for (let i = zombies.length - 1; i >= 0; i--) {
          if (zombies[i].dead) zombies.splice(i, 1);
        }

        // 割草机
        for (const mower of mowers) {
          if (!mower.moving) continue;
          mower.x += mower.speed * dt;
          for (const z of zombies) {
            if (!z.dead && !z.dying && z.row === mower.row && Math.abs(z.x - mower.x) < 36) {
              killZombie(z, 14);
            }
          }
          if (mower.x > GAME_W + 90) {
            mower.moving = false;
          }
        }

        // 阳光
        for (const s of suns) {
          if (s.falling) {
            s.y += s.fallSpeed * dt;
            if (s.y >= s.targetY) {
              s.y = s.targetY;
              s.falling = false;
              s.collectable = true;
              s.life = s.life || 9000;
            }
          } else {
            s.life -= dtMs;
            if (s.life <= 0) s.dead = true;
          }
        }
        for (let i = suns.length - 1; i >= 0; i--) {
          if (suns[i].dead) suns.splice(i, 1);
        }

        // 粒子
        for (const p of particles) {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 70 * dt;
          p.life -= dt;
        }
        for (let i = particles.length - 1; i >= 0; i--) {
          if (particles[i].life <= 0) particles.splice(i, 1);
        }

        updateCards();
      }

      function drawLawn() {
        ctx.clearRect(0, 0, GAME_W, GAME_H);
        const boardBottom = rowTopY(ROWS);

        // ===== 天空与远景 =====
        const sky = ctx.createLinearGradient(0, 0, 0, BOARD_Y);
        sky.addColorStop(0, "#8fd0f5");
        sky.addColorStop(.62, "#c9ecff");
        sky.addColorStop(1, "#eaf8d8");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, GAME_W, BOARD_Y);

        // 太阳与光晕
        const sunX = GAME_W - 210;
        const sunY = 36;
        const sunGlow = ctx.createRadialGradient(sunX, sunY, 6, sunX, sunY, 92);
        sunGlow.addColorStop(0, "rgba(255,246,200,.95)");
        sunGlow.addColorStop(.3, "rgba(255,235,150,.5)");
        sunGlow.addColorStop(1, "rgba(255,235,150,0)");
        ctx.fillStyle = sunGlow;
        ctx.fillRect(sunX - 100, sunY - 100, 200, 200);
        ctx.fillStyle = "#fff6c8";
        ctx.beginPath();
        ctx.arc(sunX, sunY, 26, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.75)";
        ctx.beginPath();
        ctx.arc(sunX - 8, sunY - 8, 9, 0, Math.PI * 2);
        ctx.fill();

        // 漂移的云
        ctx.fillStyle = "rgba(255,255,255,.85)";
        for (const c of CLOUDS) {
          const cx = ((c.x + elapsed * c.speed) % (GAME_W + 220)) - 110;
          ctx.beginPath();
          ctx.ellipse(cx, c.y, 34, 13, 0, 0, Math.PI * 2);
          ctx.ellipse(cx + 24, c.y - 7, 22, 10, 0, 0, Math.PI * 2);
          ctx.ellipse(cx - 26, c.y - 4, 20, 9, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // 远山
        ctx.fillStyle = "rgba(96, 156, 84, .55)";
        ctx.beginPath();
        ctx.moveTo(0, BOARD_Y - 2);
        for (let x = 0; x <= GAME_W; x += 40) {
          ctx.lineTo(x, BOARD_Y - 14 - Math.sin(x * .011 + 1) * 12 - Math.sin(x * .037) * 5);
        }
        ctx.lineTo(GAME_W, BOARD_Y);
        ctx.closePath();
        ctx.fill();

        // 远景树篱
        ctx.fillStyle = "rgba(52, 108, 42, .5)";
        for (let x = 16; x < GAME_W; x += 74) {
          ctx.beginPath();
          ctx.arc(x, BOARD_Y - 6, 20 + (x % 3) * 4, 0, Math.PI * 2);
          ctx.fill();
        }

        // ===== 房屋（侧视立体感）=====
        const houseBottom = boardBottom + 12;
        const houseGrad = ctx.createLinearGradient(0, BOARD_Y - 30, 150, BOARD_Y - 30);
        houseGrad.addColorStop(0, "#5b3a22");
        houseGrad.addColorStop(.6, "#8a5a35");
        houseGrad.addColorStop(1, "#9c6a40");
        ctx.fillStyle = houseGrad;
        ctx.fillRect(0, BOARD_Y - 24, HOUSE_X + 42, houseBottom - (BOARD_Y - 24));

        // 屋顶
        ctx.fillStyle = "#6e4426";
        ctx.beginPath();
        ctx.moveTo(-10, BOARD_Y - 26);
        ctx.lineTo(74, BOARD_Y - 78);
        ctx.lineTo(HOUSE_X + 52, BOARD_Y - 26);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "rgba(43, 26, 14, .6)";
        ctx.lineWidth = 3;
        ctx.stroke();

        // 门与窗
        ctx.fillStyle = "#4a2d18";
        ctx.fillRect(40, houseBottom - 96, 52, 96);
        ctx.fillStyle = "#3a2312";
        ctx.beginPath();
        ctx.arc(90, houseBottom - 48, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#2c1b10";
        ctx.fillRect(108, BOARD_Y + 12, 30, 26);
        ctx.fillRect(108, BOARD_Y + 44, 30, 26);

        // 墙砖线
        ctx.strokeStyle = "rgba(44, 27, 16, .3)";
        ctx.lineWidth = 2;
        for (let y = BOARD_Y - 24; y < houseBottom; y += 30) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(HOUSE_X + 42, y);
          ctx.stroke();
        }

        // ===== 草坪：透视行（越近越宽越高）=====
        for (let row = 0; row < ROWS; row++) {
          const yTop = rowTopY(row);
          const yBot = yTop + rowH(row);
          const depth = depthScale(row);
          const tint = .78 + depth * .22;
          const r1 = Math.round(141 * tint), g1 = Math.round(205 * tint * .97), b1 = Math.round(87 * tint * .94);
          const r2 = Math.round(111 * tint), g2 = Math.round(174 * tint * .97), b2 = Math.round(67 * tint * .94);
          for (let col = 0; col < COLS; col++) {
            const x = BOARD_X + col * CELL_W;
            const even = (row + col) % 2 === 0;
            const cellGrad = ctx.createLinearGradient(x, yTop, x, yBot);
            if (even) {
              cellGrad.addColorStop(0, `rgb(${r1},${g1},${b1})`);
              cellGrad.addColorStop(1, `rgb(${r2},${g2},${b2})`);
            } else {
              cellGrad.addColorStop(0, `rgb(${Math.round(r1 * .88)},${Math.round(g1 * .88)},${Math.round(b1 * .88)})`);
              cellGrad.addColorStop(1, `rgb(${Math.round(r2 * .88)},${Math.round(g2 * .88)},${Math.round(b2 * .88)})`);
            }
            ctx.fillStyle = cellGrad;
            ctx.fillRect(x, yTop, CELL_W, yBot - yTop);

            // 草叶短线
            ctx.strokeStyle = "rgba(48, 103, 38, .16)";
            ctx.lineWidth = 1.6;
            for (let k = 0; k < 3; k++) {
              const gx = x + 12 + ((col * 19 + k * 23 + row * 7) % (CELL_W - 24));
              const gy = yTop + 16 + ((row * 31 + k * 37 + col * 5) % (yBot - yTop - 28));
              ctx.beginPath();
              ctx.moveTo(gx, gy + 5);
              ctx.lineTo(gx + 4, gy - 3);
              ctx.stroke();
            }
          }
        }

        // 格线（横向线随行加深，强化透视）
        ctx.lineWidth = 1;
        for (let row = 0; row <= ROWS; row++) {
          const y = rowTopY(row);
          ctx.strokeStyle = `rgba(39, 81, 29, ${.12 + row * .02})`;
          ctx.beginPath();
          ctx.moveTo(BOARD_X, y);
          ctx.lineTo(BOARD_X + COLS * CELL_W, y);
          ctx.stroke();
        }
        ctx.strokeStyle = "rgba(39, 81, 29, .16)";
        for (let col = 0; col <= COLS; col++) {
          ctx.beginPath();
          ctx.moveTo(BOARD_X + col * CELL_W, BOARD_Y);
          ctx.lineTo(BOARD_X + col * CELL_W, boardBottom);
          ctx.stroke();
        }

        // 草坪远景深度渐隐
        const depthFade = ctx.createLinearGradient(0, BOARD_Y, 0, boardBottom);
        depthFade.addColorStop(0, "rgba(40, 90, 30, .28)");
        depthFade.addColorStop(.35, "rgba(40, 90, 30, 0)");
        ctx.fillStyle = depthFade;
        ctx.fillRect(BOARD_X, BOARD_Y, COLS * CELL_W, boardBottom - BOARD_Y);

        // 右侧危险路
        const road = ctx.createLinearGradient(GAME_W - 34, 0, GAME_W, 0);
        road.addColorStop(0, "rgba(0,0,0,.12)");
        road.addColorStop(1, "rgba(0,0,0,.5)");
        ctx.fillStyle = road;
        ctx.fillRect(GAME_W - 34, BOARD_Y, 34, boardBottom - BOARD_Y);
        ctx.fillStyle = "rgba(255,255,255,.14)";
        for (let row = 0; row < ROWS; row++) {
          const yTop = rowTopY(row);
          ctx.fillRect(GAME_W - 28, yTop + 16, 5, rowH(row) - 32);
        }

        // 割草机
        for (const mower of mowers) {
          if (!mower.active && !mower.moving) continue;
          drawMower(mower);
        }

        // 暗角（电影感）
        const vig = ctx.createRadialGradient(GAME_W / 2, GAME_H / 2, GAME_H * .55, GAME_W / 2, GAME_H / 2, GAME_H * .95);
        vig.addColorStop(0, "rgba(0,0,0,0)");
        vig.addColorStop(1, "rgba(0,0,0,.18)");
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, GAME_W, GAME_H);
      }

      function drawMower(mower) {

        ctx.save();
        ctx.translate(mower.x, y);

        // 影子
        ctx.fillStyle = "rgba(0,0,0,.22)";

        ctx.ellipse(0, 25, 38, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        // 车架
        const bodyGrad = ctx.createLinearGradient(0, 1, 0, 24);
        bodyGrad.addColorStop(0, "#8b9399");
        bodyGrad.addColorStop(.45, "#4c555c");
        bodyGrad.addColorStop(1, "#22282d");
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.roundRect(-31, 1, 56, 23, 6);
        ctx.fill();
        ctx.strokeStyle = "#15191c";
        ctx.lineWidth = 2;
        ctx.stroke();

        // 引擎盖
        ctx.fillStyle = "#a6afb5";
        ctx.beginPath();

        ctx.fill();
        ctx.strokeStyle = "#49535a";

        // 车轮
        ctx.fillStyle = "#15191c";
        ctx.beginPath();

        ctx.fill();
        ctx.fillStyle = "#767f85";
        ctx.beginPath();
        ctx.arc(-23, 23, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#15191c";
        ctx.beginPath();
        ctx.arc(19, 24, 8, 0, Math.PI * 2);

        ctx.fillStyle = "#767f85";

        // 把手与刀片

        ctx.stroke();
        ctx.strokeStyle = "#cfd4d7";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(24, 9);
        ctx.lineTo(30, 3);
